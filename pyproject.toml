[project]
name = "neko_anyadance_body"
version = "0.13.30"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    # onnxruntime 刻意不声明、也不进 vendor：宿主 pyproject 已声明并钉在
    # 1.25.0。打包器的 host-provided 允许清单只认 n-e-k-o，声明了就会强制
    # vendor 一份副本，于是同一进程里出现两个版本的 onnxruntime.dll，后加载
    # 的那份 DllMain 返回 1114，检测器整条降级到 OpenCV DNN。
    "opencv-python-headless>=4.10,<5",
    "dxcam[winrt]>=0.0.5,<1; sys_platform == 'win32'",
    "websocket-client>=1.8,<2",
    # scipy 被 backend/nav_loop.py 的稀疏求解用到，代码里是
    # 惰性导入 + 缺失自动回退稠密解（_have_scipy/_DENSE_SOLVER），所以缺了也
    # 能跑、只是慢 4~5 倍。这里正式声明是为了保证安装包一定带上它，不再赌宿主
    # 环境。注意宿主 HOST_PROVIDED_REQUIREMENT_NAMES 只认 n-e-k-o，声明即会被
    # vendor：安装包体积 +约 60~80MB，并多带一份 scipy 的 BLAS 动态库。
    "scipy>=1.13,<2",
    # backend/openvr_mirror.py 取 SteamVR 镜像双目（在线建图/急停），缺了就没有双目。
    "openvr>=1.26,<2; sys_platform == 'win32'",
]

[tool.neko.build]
# 安装包保留运行源码、界面和模型，排除开发及本机运行数据。
# research/ = 离线研究工具、录制器与其测试，运行时代码不得 import 它。
exclude_dirs = [".trae", ".claude", ".codex_staging", ".tmp", "tmp", "tests", "memory", "packaging", "research"]
exclude_files = [".git", "test_*.py", "backend.settings.json", "world_memory.json", "store.db"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

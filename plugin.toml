[plugin]
id = "neko_anyadance_body"
name = "N.E.K.O AnyaDance Body"
description = "让 N.E.K.O 通过 AnyaDance 与 VRChat OSC 控制虚拟身体姿态、Avatar 参数和握持输入"
short_description = "控制 AnyaDance 姿态与 VRChat OSC 动作"
keywords = ["anyadance", "steamvr", "vrchat", "osc", "body", "pose", "gesture", "姿态", "举手", "握持"]
version = "0.13.9"
type = "plugin"
entry = "plugins.neko_anyadance_body:NekoAnyadanceBodyPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "debug"
title = "AnyaDance 身体调试台"
entry = "ui/panel.tsx"
context = "debug_dashboard"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = true
auto_start = false

[anyadance]
host = "127.0.0.1"
port = 39570
rate_hz = 120

[body_profile]
height_m = 1.50
shoulder_width_m = 0.36
shoulder_drop_m = 0.18
arm_length_m = 0.58

[motion]
default_duration_ms = 600
max_queue_size = 8

[behavior]
default_crossfade_ms = 400
protect_full_body_motion = true
prefer_vmd_expressions = true
transition_history_size = 16

[vmc_idle]
enabled = true
listen_host = "127.0.0.1"
listen_port = 39539
allowed_sender = "127.0.0.1"
stale_after_ms = 500
manage_host_output = true
host_api_url = "http://127.0.0.1:48911"
host_api_timeout_seconds = 3.0
host_output_host = "127.0.0.1"
host_send_rate_hz = 60

[vrchat_osc]
enabled = true
send_host = "127.0.0.1"
send_port = 9000
listen_host = "127.0.0.1"
listen_port = 9001
allowed_sender = "127.0.0.1"
input_pulse_ms = 100
parameter_cache_size = 256
# 前四个是本插件自己驱动的动作状态参数；后六个是 VRChat 内置 Avatar 参数，
# 用于确认角色是否真的在移动（`accepted=true` 只代表本机发送成功）。
#
# ⚠️ 内置参数名未经实机验证，且只有在 avatar 的参数列表里存在时 VRChat 才会
# 驱动并回传。收不到时 body_awareness.vrchat_osc.motion 报 available=false，
# 不会把「没数据」当成「速度为零」。
awareness_parameters = [
  "NEKO_Action", "NEKO_ActionActive", "NEKO_ActionPhase", "NEKO_Holding",
  "VelocityX", "VelocityY", "VelocityZ", "AngularY", "Upright", "Grounded",
]

[input]
primary = "anyadance"
rate_hz = 120
osc_fallback = true
max_hold_ms = 10000
emergency_release_ms = 50

[autonomy]
manual_arm = true
session_ttl_minutes = 30

[world_memory]
persist_world = true
persist_players = false

# 订阅 AnyaDance 驱动的遥测多播，用于确认驱动是否真的收到了命令。
# 需要驱动支持该通道（steamvr.vrsettings 的 driver_anyadance.command_log_enabled）；
# 旧版驱动下监听器会正常启动但收不到数据，相关字段回落为 unknown/unsupported。
[driver_log]
enabled = true
multicast_group = "239.255.39.71"
listen_port = 39571
interface_host = "127.0.0.1"
stale_after_ms = 3000
history_size = 64

# 模型无关的视觉 worker；具体 FrameSource/FrameDetector 由独立后端注入。
# 默认关闭，未接入外部 detector 时不会抓屏或加载模型。
[vision]
enabled = true
source = "none"
capture = "desktop_mirror"
local_backend = "openvino"
# OpenVINO IR XML/ONNX 模型和可选标签文件。留空表示未部署本地模型；此时感知
# 会报告 unavailable，而不是进行猜测。
model_path = "H:/AI/neko-music/vrc/anime_models/person_detect_v1.3_s_model.onnx"
labels_path = "H:/AI/neko-music/vrc/anime_models/person_detect_v1.3_s_labels.json"
device = "AUTO"
# none（默认），或显式启用降级的 OpenCV HOG 仅人形回退。
fallback_backend = "none"
confidence_threshold = 0.35
input_width = 640
input_height = 640
horizontal_fov_deg = 90.0
max_detections = 64
# 检测框宽/高占画面的最小比例。实测真实帧里出现过 27×27 px 的高分假阳性，
# 它们会被跟踪器当成真人并污染导航距离闭环。
#
# 宽高分开设阈值：站立的人在画面里高而窄，共用一个 2% 时总是宽度先卡——
# 1920 宽下要求最小宽 38 px，按人体长宽比反推，能进入世界的最小
# apparent_height 已经有 7%~11%，而导航器的目标是 0.55。也就是说房间对面
# 的人会和噪点一起被裁掉。宽阈值放松到 0.8%，让高度成为主判据；两条边仍然
# 都要过关，墙缝和 UI 边框照样被挡住。
#
# min_box_ratio 是两轴的共同回退值（旧配置仍然有效）。0 表示关闭对应轴。
min_box_ratio = 0.02
min_box_width_ratio = 0.008
min_box_height_ratio = 0.02
semantic_backend = "openai_compatible"
semantic_max_per_minute = 30
# 给 agent 看的单槽帧缓存。这条路径与 world_state 完全无关：帧只喂理解，不
# 产生实体也不产生事件，更不能用来满足 body_reach_and_grab 的 preconditions。
# 编码只在采集线程里按 frame_cache_interval_s 做一次，之后所有拉取命中缓存。
frame_cache_interval_s = 1.0
# 降采样宽度。给 LLM 的图不需要原始分辨率——降采样同时压低 token 成本和
# 「盯着模糊像素脑补」的风险。0 表示不缩放。
frame_max_width = 960
frame_jpeg_quality = 70
# agent 主动调用 vrc_vision_frame 的每分钟上限（滑动窗口）。一张 960 px 的
# JPEG 进上下文是十万字符量级的 base64，循环里每回合拉一张能把会话挤爆。
# 0 表示禁止拉图，不是不限量。主动唤醒配的图不占这个预算，它自己有 12 s 的
# 最小间隔。
frame_max_per_minute = 10
# -1 自动探测；物理显示器优先，0 表示 MSS 虚拟桌面。
monitor_index = -1
# DXcam 的设备/输出索引；-1 自动探测全部可见适配器与输出。
dxcam_device_idx = -1
dxcam_output_idx = -1
# auto 先尝试 DXGI，再尝试 Windows Graphics Capture (WinRT)。
dxcam_backend = "auto"
interval_ms = 100
queue_size = 1
# 检测器的 CPU 上限，三个旋钮拧的是三个不同的池子，缺一个就收不住。
#
# 排查结论（20 核机器，1161x766 采集区，实测）：吃满 CPU 的**主因不是 YOLO**。
# numpy 的 BLAS（scipy-openblas，OpenMP 线程模型）按逻辑核数开线程并且**自旋
# 等待**，采集与前后处理全走它。把检测器换成空实现、一次推理都不做，仅采集路径
# 就空转掉 7.23 核：
#
#   默认                        7.23 核   6.8 帧/秒
#   OMP_NUM_THREADS=2          0.87 核   6.8 帧/秒
#   OMP_WAIT_POLICY=PASSIVE    0.11 核   6.9 帧/秒   <- 三行吞吐一样
#
# 吞吐完全不变，所以那 7 核是纯空转，不是计算。这两个环境变量由
# backend/local_perception.py 的 cap_openmp_threads() 在 BackendService.__init__
# 里设（必须早于 numpy 被导入），detector_threads 同时作为 OMP_NUM_THREADS 的值。
#
# detector_threads 还限 ONNX Runtime 自己的线程池（SessionOptions），
# detector_interval_ms 限「一秒里推几次」。ORT 在这个模型上并行效率很差——单次
# 推理的总 CPU 开销 10 线程要 1.44 CPU·秒，2 线程只要 0.52，6→10 线程甚至是负
# 收益，所以砍线程数几乎不牺牲延迟。0 表示沿用 ONNX Runtime 默认（=物理核数），
# 同时也关掉上面的 OpenMP 收口——只留给需要裸速度的基准测量。
#
# 全部装上之后的整条流水线实测：7.04 核 → 1.22 核，单次延迟反而从 469ms 降到
# 328ms（少了 18 个线程抢核）。
detector_threads = 2
# 推理最小间隔。只限检测，不限给 agent 看的帧缓存（那个由
# frame_cache_interval_s 独立控制）。跳过的帧不写世界状态：补空观测会把
# 「这一帧没看」伪造成「这一帧什么都没有」。0 表示不限速。
detector_interval_ms = 500
lifecycle_watermark_limit = 4096
# 按窗口标题限定采集区域。非空时通过 FindWindow 取窗口坐标后只采集该矩形
# 区域，而不是整块显示器。窗口未找到时回落到全屏采集。
window_title = "VRChat"
# 重新解析窗口矩形的间隔（毫秒）。窗口被拖动、改分辨率或全屏切换后，启动时
# 解析的坐标就过期了；矩形真的变了才会重建采集源。0 表示只在启动时解析一次。
window_track_interval_ms = 5000

[clips]
directory = "motions"
max_file_bytes = 67108864
max_frames = 18000
max_duration_seconds = 300

# 比 AnyaDance 驱动更严格的安全子集。驱动本身允许 ±30 m 位置、25 m 高度。
# 可放宽到 max_position_abs_m = 30.0、max_y_m = 25.0，但必须满足
# max_y_m <= max_position_abs_m，否则位置校验会拒绝被 Y 钳制后的帧。
[safety]
max_position_abs_m = 3.0
max_y_m = 2.0
max_linear_speed_mps = 2.0
max_angular_speed_dps = 360.0
max_action_duration_ms = 5000

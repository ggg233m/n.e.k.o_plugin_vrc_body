[plugin]
id = "neko_anyadance_body"
name = "N.E.K.O AnyaDance Body"
description = "让 N.E.K.O 感知当前 VRChat 画面，以稳定实体 ID 搜索、接近或跟随 NPC/玩家，并通过 AnyaDance 与 OSC 控制虚拟身体"
short_description = "VRChat 视觉感知、本地导航与 AnyaDance 身体控制"
keywords = ["anyadance", "steamvr", "vrchat", "vision", "navigation", "npc", "follow", "osc", "body", "视觉", "感知", "导航", "移动", "跟随"]
version = "0.13.21"
type = "plugin"
entry = "plugins.neko_anyadance_body:NekoAnyadanceBodyPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "debug"
title = "AnyaDance 身体调试台"
entry = "ui/panel.tsx"
context = "debug_dashboard"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = true
auto_start = false

[anyadance]
host = "127.0.0.1"
port = 39570
rate_hz = 120

[body_profile]
height_m = 1.50
shoulder_width_m = 0.36
shoulder_drop_m = 0.18
arm_length_m = 0.58

[motion]
default_duration_ms = 600
max_queue_size = 8

[behavior]
default_crossfade_ms = 400
protect_full_body_motion = true
prefer_vmd_expressions = true
transition_history_size = 16

[vmc_idle]
enabled = true
listen_host = "127.0.0.1"
listen_port = 39539
allowed_sender = "127.0.0.1"
stale_after_ms = 500
manage_host_output = true
host_api_url = "http://127.0.0.1:48911"
host_api_timeout_seconds = 3.0
host_output_host = "127.0.0.1"
host_send_rate_hz = 60

[vrchat_osc]
enabled = true
send_host = "127.0.0.1"
send_port = 9000
listen_host = "127.0.0.1"
listen_port = 9001
allowed_sender = "127.0.0.1"
input_pulse_ms = 100
parameter_cache_size = 256
# 前四个是本插件自己驱动的动作状态参数；后六个是 VRChat 内置 Avatar 参数，
# 用于确认角色是否真的在移动（`accepted=true` 只代表本机发送成功）。
#
# ✅ 内置参数名已实机验证（2026-08-23），VelocityX/Z 为 avatar 本地系，且只有角色
# 移动时才回传。旧速度不会永久缓存为当前状态；静止时缺包属于正常现象。但只有在
# avatar 的参数列表里存在时 VRChat 才会驱动并回传。收不到时
# body_awareness.vrchat_osc.motion 报 available=false，
# 不会把「没数据」当成「速度为零」。
awareness_parameters = [
  "NEKO_Action", "NEKO_ActionActive", "NEKO_ActionPhase", "NEKO_Holding",
  "VelocityX", "VelocityY", "VelocityZ", "AngularY", "Upright", "Grounded",
]

[input]
primary = "anyadance"
rate_hz = 120
osc_fallback = true
max_hold_ms = 10000
emergency_release_ms = 50

[autonomy]
manual_arm = true
session_ttl_minutes = 30

[world_memory]
# 只保存可复用的 world:* 等世界事实。检测轨迹、avatar:session:*、synthetic
# 实体和 memory_scope="observation" 的外部观测始终只存在于当前会话。
persist_world = true
persist_players = false

# 订阅 AnyaDance 驱动的遥测多播，用于确认驱动是否真的收到了命令。
# 需要驱动支持该通道（steamvr.vrsettings 的 driver_anyadance.command_log_enabled）；
# 旧版驱动下监听器会正常启动但收不到数据，相关字段回落为 unknown/unsupported。
[driver_log]
enabled = true
multicast_group = "239.255.39.71"
listen_port = 39571
interface_host = "127.0.0.1"
stale_after_ms = 3000
history_size = 64

# 模型无关的视觉 worker；具体 FrameSource/FrameDetector 由独立后端注入。
# 默认关闭，未接入外部 detector 时不会抓屏或加载模型。
[vision]
enabled = true
# 直接从桌面镜像采集 VRChat；window_title 会在多屏环境中跟踪窗口区域。
source = "desktop_mirror"
capture = "desktop_mirror"
local_backend = "openvino"
# OpenVINO IR XML/ONNX 模型和可选标签文件。留空表示未部署本地模型；此时感知
# 会报告 unavailable，而不是进行猜测。
model_path = "H:/AI/neko-music/vrc/anime_models/person_detect_v1.3_s_model.onnx"
labels_path = "H:/AI/neko-music/vrc/anime_models/person_detect_v1.3_s_labels.json"
# AUTO 表示按 NPU -> GPU -> CPU 挨个试，取第一个能编译的；实际落在哪个设备
# 由 /perception 的 resolved_device 报出，失败原因在 device_fallbacks 里。
#
# 注意 AUTO 不会原样传给 OpenVINO 的 AUTO 插件。实测 AUTO 插件把首帧放在 CPU
# 上（EXECUTION_DEVICES=['(CPU)']）、GPU 在后台慢慢编译，对感知循环来说等于
# 长时间拿不到加速。所以这里自己展开成显式逐个尝试。
#
# 实测（Intel Arc A770 + Xeon E5-2666 v3，person_detect_v1.3_s @640）：
#   ORT CPU / 2 线程       258 ms   端到端
#   OpenVINO CPU / 2 线程  354 ms   端到端
#   OpenVINO GPU            44 ms   端到端（裸推理 11.7 ms，整卡驻留 +79 MB）
# GPU 默认跑 FP16，但分数偏差只有 0.004（CPU 0.7846 vs GPU 0.7847），过 0.25
# 阈值的框两边都是 9 个，所以下面的 confidence_threshold 不需要跟着改。
device = "AUTO"
# ONNX 模型的可选 NVIDIA 后端。auto 在 OpenVINO NPU/GPU 不可用时探测
# ONNX Runtime 的 CUDAExecutionProvider；prefer 可让 NVIDIA 抢在 OpenVINO
# NPU/GPU 前，disabled 完全跳过。没有 onnxruntime-gpu、CUDA 或 cuDNN 时记录
# 原因并继续回落，不影响启动。
onnxruntime_cuda = "auto"
onnxruntime_cuda_device_id = 0
# none（默认），或显式启用降级的 OpenCV HOG 仅人形回退。
fallback_backend = "none"
# 0.35 → 0.25：实测三帧真机对比，中距离的模型只打到 0.296，0.35 会整帧丢掉；
# 降到 0.25 后该帧稳定检出，且同批帧未出现假阳性。近距离全身像打 0.85+，不受影响。
confidence_threshold = 0.25
input_width = 640
input_height = 640
horizontal_fov_deg = 90.0
max_detections = 64
# 检测框宽/高占画面的最小比例。实测真实帧里出现过 27×27 px 的高分假阳性，
# 它们会被跟踪器当成真人并污染导航距离闭环。
#
# 宽高分开设阈值：站立的人在画面里高而窄，共用一个 2% 时总是宽度先卡——
# 1920 宽下要求最小宽 38 px，按人体长宽比反推，能进入世界的最小
# apparent_height 已经有 7%~11%，而导航器的目标是 0.55。也就是说房间对面
# 的人会和噪点一起被裁掉。宽阈值放松到 0.8%，让高度成为主判据；两条边仍然
# 都要过关，墙缝和 UI 边框照样被挡住。
#
# min_box_ratio 是两轴的共同回退值（旧配置仍然有效）。0 表示关闭对应轴。
min_box_ratio = 0.02
min_box_width_ratio = 0.008
min_box_height_ratio = 0.02
# 会话级 Avatar 外观重识别。YOLO 的 track_id 变化后，用最多 6 个多视角颜色/布局
# 原型恢复稳定 ID；相似旧模板按背景指纹、15 秒内几何、长期稳定度依次消歧。特征只
# 保留在当前后端内存中；两个相同 Avatar 或镜像仍可能歧义。
identity_reid_enabled = true
identity_reid_similarity = 0.90
identity_reid_margin = 0.04
identity_reid_retention_s = 1800.0
identity_reid_max_identities = 128
# main_llm 把语义任务作为被动图片上下文并入宿主已有对话，不另起一次模型调用。
# 独立运行且没有 N.E.K.O 宿主时，可在配置面板切换为 openai_compatible。
semantic_backend = "main_llm"
# openai_compatible 模式下，独立后端配置面板可以把下面两项写到
# backend.settings.json；环境变量 VRC_VLM_ENDPOINT / OPENAI_BASE_URL 与
# VRC_VLM_MODEL / OPENAI_VLM_MODEL 优先。
semantic_endpoint = ""
semantic_model = "gpt-4o-mini"
semantic_max_per_minute = 30
# selector 未解决时，下一张主 LLM 语义图的最小间隔。pending 单槽不会重复注入，
# 所以 12 秒是兜底重试而不是固定截图频率。
semantic_main_llm_min_interval_s = 12.0
# 给 agent 看的单槽内存帧缓存。这条路径与 world_state 完全无关：帧只喂理解，不
# 产生实体也不产生事件，更不能用来满足 body_reach_and_grab 的 preconditions。
# 检测完成后 JPEG、同帧实体和 revision 一起覆盖内存单槽；不写临时图片、不保留
# 历史、不增加世界持久化写入。编码按 frame_cache_interval_s 限流。
frame_cache_interval_s = 1.0
# 降采样宽度。给 LLM 的图不需要原始分辨率——降采样同时压低 token 成本和
# 「盯着模糊像素脑补」的风险。0 表示不缩放。
frame_max_width = 960
frame_jpeg_quality = 70
# agent 主动调用 vrc_vision_frame 的每分钟上限（滑动窗口）。一张 960 px 的
# JPEG 进上下文是十万字符量级的 base64，循环里每回合拉一张能把会话挤爆。
# 0 表示禁止拉图，不是不限量。主动唤醒配的图不占这个预算，它自己有 12 s 的
# 最小间隔。
frame_max_per_minute = 10
# -1 自动探测；物理显示器优先，0 表示 MSS 虚拟桌面。
monitor_index = -1
# DXcam 的设备/输出索引；-1 自动探测全部可见适配器与输出。
dxcam_device_idx = -1
dxcam_output_idx = -1
# auto 先尝试 DXGI，再尝试 Windows Graphics Capture (WinRT)。
dxcam_backend = "auto"
interval_ms = 100
queue_size = 1
# 检测器的 CPU 上限，三个旋钮拧的是三个不同的池子，缺一个就收不住。
#
# 排查结论（20 核机器，1161x766 采集区，实测）：吃满 CPU 的**主因不是 YOLO**。
# numpy 的 BLAS（scipy-openblas，OpenMP 线程模型）按逻辑核数开线程并且**自旋
# 等待**，采集与前后处理全走它。把检测器换成空实现、一次推理都不做，仅采集路径
# 就空转掉 7.23 核：
#
#   默认                        7.23 核   6.8 帧/秒
#   OMP_NUM_THREADS=2          0.87 核   6.8 帧/秒
#   OMP_WAIT_POLICY=PASSIVE    0.11 核   6.9 帧/秒   <- 三行吞吐一样
#
# 吞吐完全不变，所以那 7 核是纯空转，不是计算。这两个环境变量由
# backend/local_perception.py 的 cap_openmp_threads() 在 BackendService.__init__
# 里设（必须早于 numpy 被导入），detector_threads 同时作为 OMP_NUM_THREADS 的值。
#
# detector_threads 还限 ONNX Runtime 自己的线程池（SessionOptions），
# detector_interval_ms 限「一秒里推几次」。ORT 在这个模型上并行效率很差——单次
# 推理的总 CPU 开销 10 线程要 1.44 CPU·秒，2 线程只要 0.52，6→10 线程甚至是负
# 收益，所以砍线程数几乎不牺牲延迟。0 表示沿用 ONNX Runtime 默认（=物理核数），
# 同时也关掉上面的 OpenMP 收口——只留给需要裸速度的基准测量。
#
# 全部装上之后的整条流水线实测：7.04 核 → 1.22 核，单次延迟反而从 469ms 降到
# 328ms（少了 18 个线程抢核）。
detector_threads = 2
# CPU/未知设备的推理最小间隔。只限检测，不限给 agent 看的帧缓存（那个由
# frame_cache_interval_s 独立控制）。跳过的帧不写世界状态：补空观测会把
# 「这一帧没看」伪造成「这一帧什么都没有」。0 表示不限速。CPU 单次推理
# 258~354 ms，若也设成 100 ms，每次推完下一帧已经到期，会退化成连续满载。
detector_interval_ms = 500
#
# 实际解析到 OpenVINO GPU/NPU 或 ORT CUDA 时改用下面的加速器间隔；设备编译
# 失败、落回 OpenVINO CPU/ORT CPU/OpenCV 或状态未知时仍保留上面的 500 ms。
# Arc GPU 单次只有 48 ms，500 ms 会变成感知延迟的主要来源。
#
# 实测（Arc A770，真实 VRChat 窗口 1161x766，各档跑 10 s）：
#   间隔     帧率      感知延迟   检测器 CPU   GPU-3D（基线 77%）
#   500ms   1.80/s      298ms      0.89 核      74.7%
#   100ms   5.60/s       98ms      0.93 核      75.2%   <- 采纳
#    50ms   6.50/s       74ms      0.88 核      72.6%
#     0ms   6.40/s       48ms      0.85 核      69.4%
#
# 选 100 而不是更低：50 和 0 的帧率已经撞到 6.5/s 的天花板，那是 interval_ms
# = 100 的采集节奏决定的，不是限速决定的。再往下调只是让循环空转着重复推同
# 一批帧——要继续降延迟得先动采集间隔，而那会连带抬高 DXGI 的开销。
#
# CPU 在各档几乎不变（0.85~0.93 核），因为大头是采集和 OpenMP 收口，与推几次
# 无关。GPU 也没有随帧率上升——推理只占 11.7 ms，剩下的是预处理，跑在 CPU 上。
detector_accelerator_interval_ms = 100
lifecycle_watermark_limit = 4096
# 按窗口标题限定采集区域。非空时通过 FindWindow 取窗口坐标后只采集该矩形
# 区域，而不是整块显示器。窗口未找到时回落到全屏采集。
window_title = "VRChat"
# 重新解析窗口矩形的间隔（毫秒）。窗口被拖动、改分辨率或全屏切换后，启动时
# 解析的坐标就过期了；矩形真的变了才会重建采集源。0 表示只在启动时解析一次。
window_track_interval_ms = 5000

[clips]
directory = "motions"
max_file_bytes = 67108864
max_frames = 18000
max_duration_seconds = 300

# 比 AnyaDance 驱动更严格的安全子集。驱动本身允许 ±30 m 位置、25 m 高度。
# 可放宽到 max_position_abs_m = 30.0、max_y_m = 25.0，但必须满足
# max_y_m <= max_position_abs_m，否则位置校验会拒绝被 Y 钳制后的帧。
[safety]
max_position_abs_m = 3.0
max_y_m = 2.0
max_linear_speed_mps = 2.0
max_angular_speed_dps = 360.0
max_action_duration_ms = 5000

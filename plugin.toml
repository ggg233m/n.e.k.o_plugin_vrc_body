[plugin]
id = "yui_npc_controller"
name = "YUI NPC Controller"
description = "通过 YUI v1.1/v1.2 MIDI/VRChat 日志协议，让 N.E.K.O 在人工授权后观察世界并编排原生 NPC"
short_description = "YUI 世界原生 NPC 的独立控制插件"
keywords = ["yui", "vrchat", "npc", "midi", "llm", "世界原生"]
version = "0.3.0"
type = "plugin"
entry = "plugin.plugins.yui_npc_controller:YuiNpcControllerPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

# YUI 直接驱动世界原生 NPC，与 AnyaDance/YOLO 身体方案互斥。
[[plugin.dependency]]
id = "neko_anyadance_body"
conflicts = true

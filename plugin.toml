[plugin]
id = "neko_anyadance_body"
name = "N.E.K.O AnyaDance Body"
description = "让 N.E.K.O 通过 AnyaDance 与 VRChat OSC 控制虚拟身体姿态、Avatar 参数和握持输入"
short_description = "控制 AnyaDance 姿态与 VRChat OSC 动作"
keywords = ["anyadance", "steamvr", "vrchat", "osc", "body", "pose", "gesture", "姿态", "举手", "握持"]
version = "0.13.9"
type = "plugin"
entry = "plugins.neko_anyadance_body:NekoAnyadanceBodyPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "debug"
title = "AnyaDance 身体调试台"
entry = "ui/panel.tsx"
context = "debug_dashboard"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = true
auto_start = false

[anyadance]
host = "127.0.0.1"
port = 39570
rate_hz = 120

[body_profile]
height_m = 1.50
shoulder_width_m = 0.36
shoulder_drop_m = 0.18
arm_length_m = 0.58

[motion]
default_duration_ms = 600
max_queue_size = 8

[behavior]
default_crossfade_ms = 400
protect_full_body_motion = true
prefer_vmd_expressions = true
transition_history_size = 16

[vmc_idle]
enabled = true
listen_host = "127.0.0.1"
listen_port = 39539
allowed_sender = "127.0.0.1"
stale_after_ms = 500
manage_host_output = true
host_api_url = "http://127.0.0.1:48911"
host_api_timeout_seconds = 3.0
host_output_host = "127.0.0.1"
host_send_rate_hz = 60

[vrchat_osc]
enabled = true
send_host = "127.0.0.1"
send_port = 9000
listen_host = "127.0.0.1"
listen_port = 9001
allowed_sender = "127.0.0.1"
input_pulse_ms = 100
parameter_cache_size = 256
awareness_parameters = ["NEKO_Action", "NEKO_ActionActive", "NEKO_ActionPhase", "NEKO_Holding"]

[input]
primary = "anyadance"
rate_hz = 120
osc_fallback = true
max_hold_ms = 10000
emergency_release_ms = 50

[autonomy]
manual_arm = true
session_ttl_minutes = 30

[world_memory]
persist_world = true
persist_players = false

# 订阅 AnyaDance 驱动的遥测多播，用于确认驱动是否真的收到了命令。
# 需要驱动支持该通道（steamvr.vrsettings 的 driver_anyadance.command_log_enabled）；
# 旧版驱动下监听器会正常启动但收不到数据，相关字段回落为 unknown/unsupported。
[driver_log]
enabled = true
multicast_group = "239.255.39.71"
listen_port = 39571
interface_host = "127.0.0.1"
stale_after_ms = 3000
history_size = 64

# 模型无关的视觉 worker；具体 FrameSource/FrameDetector 由独立后端注入。
# 默认关闭，未接入外部 detector 时不会抓屏或加载模型。
[vision]
enabled = true
source = "none"
capture = "desktop_mirror"
local_backend = "openvino"
# OpenVINO IR XML/ONNX 模型和可选标签文件。留空表示未部署本地模型；此时感知
# 会报告 unavailable，而不是进行猜测。
model_path = "H:/AI/neko-music/vrc/anime_models/person_detect_v1.3_s_model.onnx"
labels_path = "H:/AI/neko-music/vrc/anime_models/person_detect_v1.3_s_labels.json"
device = "AUTO"
# none（默认），或显式启用降级的 OpenCV HOG 仅人形回退。
fallback_backend = "none"
confidence_threshold = 0.35
input_width = 640
input_height = 640
horizontal_fov_deg = 90.0
max_detections = 64
semantic_backend = "openai_compatible"
semantic_max_per_minute = 30
# -1 自动探测；物理显示器优先，0 表示 MSS 虚拟桌面。
monitor_index = -1
# DXcam 的设备/输出索引；-1 自动探测全部可见适配器与输出。
dxcam_device_idx = -1
dxcam_output_idx = -1
# auto 先尝试 DXGI，再尝试 Windows Graphics Capture (WinRT)。
dxcam_backend = "auto"
interval_ms = 100
queue_size = 1
lifecycle_watermark_limit = 4096
# 按窗口标题限定采集区域。非空时通过 FindWindow 取窗口坐标后只采集该矩形
# 区域，而不是整块显示器。窗口未找到时回落到全屏采集。
window_title = "VRChat"

[clips]
directory = "motions"
max_file_bytes = 67108864
max_frames = 18000
max_duration_seconds = 300

# 比 AnyaDance 驱动更严格的安全子集。驱动本身允许 ±30 m 位置、25 m 高度。
# 可放宽到 max_position_abs_m = 30.0、max_y_m = 25.0，但必须满足
# max_y_m <= max_position_abs_m，否则位置校验会拒绝被 Y 钳制后的帧。
[safety]
max_position_abs_m = 3.0
max_y_m = 2.0
max_linear_speed_mps = 2.0
max_angular_speed_dps = 360.0
max_action_duration_ms = 5000
